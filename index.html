<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>希腊驾照模拟 - V16 修复版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #00529b; --success: #27ae60; --error: #e74c3c; --bg: #f4f7f9; --accent: #ff9800; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 0; user-select: none; }
        .nav { background: var(--primary); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; }
        .nav h2 { margin: 0; font-size: 1rem; }
        .container { max-width: 800px; margin: 10px auto; padding: 0 10px; padding-bottom: 120px; }
        .mode-tabs { display: flex; background: white; border-radius: 12px; margin-bottom: 15px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: bold; font-size: 0.9rem; color: #666; }
        .tab.active { background: var(--primary); color: white; }
        .cat-list { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .cat-item { display: flex; flex-direction: column; padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .cat-info { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }
        .progress-bar { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); transition: width 0.3s; }
        .q-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 15px; }
        .img-container { text-align: center; margin-bottom: 15px; background: #fafafa; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid #eee; }
        .img-container img { max-width: 100%; max-height: 300px; border-radius: 8px; }
        .img-err { color: #e74c3c; font-size: 0.7rem; padding: 10px; font-weight: bold; }
        .q-text { border-left: 5px solid var(--primary); padding-left: 12px; margin-bottom: 20px; }
        .en { font-size: 1.1rem; font-weight: bold; color: #2d3748; display: block; margin-bottom: 5px; }
        .cn { font-size: 1.05rem; color: #16a085; display: block; }
        .opt { border: 2px solid #edf2f7; border-radius: 12px; padding: 15px; margin-bottom: 10px; cursor: pointer; background: #fff; display: flex; }
        .opt.correct { background: #e6fffa !important; border-color: var(--success) !important; color: #22543d; font-weight: bold; }
        .opt.wrong { background: #fff5f5 !important; border-color: var(--error) !important; color: #822727; }
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -3px 15px rgba(0,0,0,0.05); }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: var(--primary); color: white; }
        .btn-grey { background: #edf2f7; color: #4a5568; }
        .hidden { display: none !important; }
        #debugPrefix { font-size: 0.7rem; background: #fffde7; padding: 5px; text-align: center; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="nav">
    <h2 id="navTitle">希腊驾照模拟</h2>
    <select id="fileSelect" onchange="loadFile()">
        <option value="data.csv">汽车题库</option>
        <option value="datamoto.csv">摩托题库</option>
    </select>
</div>

<div id="debugPrefix" class="hidden">
    图片修正(若不出图请改此汉字): <input type="text" id="manualPrefix" style="width:70px" oninput="updatePrefix()">
</div>

<div class="container">
    <div id="mainTabs" class="mode-tabs hidden">
        <div id="tab-list" class="tab active" onclick="switchMode('list')">专题</div>
        <div id="tab-mistake" class="tab" onclick="switchMode('mistake')">错题本</div>
        <div class="tab" onclick="startExam()">模拟考</div>
    </div>
    <div id="listView" class="cat-list hidden"></div>
    <div id="quizView" class="hidden"><div id="quizContent"></div></div>
    <div id="resultView" class="hidden" style="text-align:center; padding:40px; background:white; border-radius:15px;"></div>
</div>

<div id="quizFooter" class="footer hidden">
    <button class="btn btn-grey" onclick="moveQ(-1)">上题</button>
    <div id="pageInfo" style="font-weight:bold; font-size:0.85rem"></div>
    <button class="btn" onclick="moveQ(1)">下题</button>
</div>

<script>
    let masterData = [], currentQuestions = [], currentIdx = 0, currentMode = 'list';
    let userHistory = JSON.parse(localStorage.getItem('greece_history_v2') || '{}');
    let mistakeIds = JSON.parse(localStorage.getItem('greece_mistakes_v2') || '[]');

    window.onload = loadFile;

    function loadFile() {
        const file = document.getElementById('fileSelect').value;
        Papa.parse(file, {
            download: true, skipEmptyLines: true,
            complete: (res) => {
                parseCSV(res.data);
                showDashboard();
            }
        });
    }

    function parseCSV(data) {
        masterData = [];
        for (let col = 0; col < data[0].length; col += 3) {
            let catCn = data[0][col+1] || "";
            if (!data[0][col]) continue;
            let imgPrefix = catCn.split("专题")[0].trim();
            let qCounter = 1;
            for (let row = 1; row < data.length; row++) {
                if (data[row][col] && data[row][col].trim().length > 5) {
                    const q = splitLogic(data[row][col], data[row][col+1]);
                    if (q) {
                        q.cat = catCn.trim();
                        q.prefix = imgPrefix;
                        q.num = qCounter;
                        q.uid = catCn + "_" + qCounter;
                        masterData.push(q);
                        qCounter++;
                    }
                }
            }
        }
    }

    function splitLogic(en, cn) {
        let ans = -1; const t = cn.replace(/\s/g, "");
        if (t.includes("√1)")) ans = 0; else if (t.includes("√2)")) ans = 1; else if (t.includes("√3)")) ans = 2;
        const s = (txt) => {
            let p = txt.split(/\d\)\s?/);
            return { q: p[0].replace(/√/g, "").trim(), o: p.slice(1).map(x => x.replace(/√/g, "").trim()).filter(x => x !== "") };
        };
        const eC = s(en), cC = s(cn);
        if (eC.o.length < 2) return null;
        return { qEn: eC.q, qCn: cC.q, options: eC.o.map((e, i) => ({ en: e, cn: cC.o[i] || "" })), ans };
    }

    function showDashboard() {
        currentMode = 'list';
        document.getElementById('navTitle').innerText = "希腊驾照模拟 - 专题";
        document.getElementById('mainTabs').classList.remove('hidden');
        document.getElementById('listView').classList.remove('hidden');
        document.getElementById('quizView').classList.add('hidden');
        document.getElementById('quizFooter').classList.add('hidden');
        document.getElementById('resultView').classList.add('hidden');
        document.getElementById('debugPrefix').classList.add('hidden');
        document.getElementById('tab-list').className = 'tab active';
        document.getElementById('tab-mistake').className = 'tab';
        document.getElementById('tab-mistake').innerText = `错题本 (${mistakeIds.length})`;

        const cats = [...new Set(masterData.map(d => d.cat))];
        let html = "";
        cats.forEach(c => {
            const list = masterData.filter(d => d.cat === c);
            const done = list.filter(d => userHistory[d.uid]).length;
            const perc = Math.round((done / list.length) * 100);
            html += `<div class="cat-item" onclick="startMode('practice','${c}')">
                <div class="cat-info"><b>${c}</b><span>${done}/${list.length}</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:${perc}%"></div></div>
            </div>`;
        });
        document.getElementById('listView').innerHTML = html;
    }

    function startMode(mode, cat) {
        currentMode = mode;
        if (mode === 'practice') currentQuestions = masterData.filter(d => d.cat === cat);
        else if (mode === 'mistake') {
            currentQuestions = masterData.filter(d => mistakeIds.includes(d.uid));
            if(currentQuestions.length===0) return alert("暂无错题！");
        }
        currentIdx = 0;
        enterQuiz();
    }

    function startExam() {
        currentMode = 'exam';
        currentQuestions = [...masterData].sort(() => 0.5 - Math.random()).slice(0, 30);
        currentQuestions.forEach(q => delete q.userAns);
        currentIdx = 0;
        enterQuiz();
    }

    function enterQuiz() {
        document.getElementById('mainTabs').classList.add('hidden');
        document.getElementById('listView').classList.add('hidden');
        document.getElementById('quizView').classList.remove('hidden');
        document.getElementById('quizFooter').classList.remove('hidden');
        document.getElementById('debugPrefix').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        const q = currentQuestions[currentIdx];
        const isAnswered = q.userAns !== undefined;
        document.getElementById('navTitle').innerText = q.cat.split('(')[0];
        document.getElementById('pageInfo').innerText = `${currentIdx + 1} / ${currentQuestions.length}`;
        document.getElementById('manualPrefix').value = q.prefix;

        // 核心修正：使用 encodeURI 处理中文名，并尝试两个路径
        const fileName = q.prefix + q.num + ".jpg";
        const encodedName = encodeURI(fileName);

        let html = `
            <div class="q-card">
                <div class="img-container">
                    <img src="${encodedName}" onerror="trySubPath(this, '${encodedName}', '${fileName}')">
                </div>
                <div class="q-text"><span class="en">${q.qEn}</span><span class="cn">${q.qCn}</span></div>
                <div class="options">
                    ${q.options.map((o, i) => {
                        let cls = isAnswered ? (i === q.ans ? "correct" : (i === q.userAns ? "wrong" : "")) : "";
                        return `<div class="opt ${cls}" onclick="handleCheck(${i})">
                            <span style="font-weight:bold;margin-right:10px">${i+1})</span>
                            <div style="flex:1"><div>${o.en}</div><div style="color:#666;font-size:0.9rem">${o.cn}</div></div>
                        </div>`;
                    }).join("")}
                </div>
            </div>`;
        document.getElementById('quizContent').innerHTML = html;
    }

    function trySubPath(img, encoded, raw) {
        if (!img.dataset.tried) {
            img.dataset.tried = "true";
            img.src = "images/" + encoded;
        } else {
            img.parentElement.innerHTML = `<div class="img-err">未找到图片：${raw}<br>(请确保GitHub上有此文件)</div>`;
        }
    }

    function updatePrefix() {
        const val = document.getElementById('manualPrefix').value;
        currentQuestions[currentIdx].prefix = val;
        renderQuestion();
    }

    function handleCheck(idx) {
        const q = currentQuestions[currentIdx];
        if (q.userAns !== undefined) return;
        q.userAns = idx;
        if (idx === q.ans) {
            userHistory[q.uid] = true;
            localStorage.setItem('greece_history_v2', JSON.stringify(userHistory));
        } else {
            if (!mistakeIds.includes(q.uid)) {
                mistakeIds.push(q.uid);
                localStorage.setItem('greece_mistakes_v2', JSON.stringify(mistakeIds));
            }
        }
        renderQuestion();
        if (currentMode === 'exam') setTimeout(() => moveQ(1), 1000);
    }

    function moveQ(s) {
        if (currentMode === 'exam' && currentIdx === currentQuestions.length - 1 && s > 0) return finishExam();
        currentIdx = (currentIdx + s + currentQuestions.length) % currentQuestions.length;
        renderQuestion();
        window.scrollTo(0,0);
    }

    function finishExam() {
        const score = currentQuestions.filter(q => q.userAns === q.ans).length;
        document.getElementById('quizView').classList.add('hidden');
        document.getElementById('quizFooter').classList.add('hidden');
        document.getElementById('debugPrefix').classList.add('hidden');
        const rv = document.getElementById('resultView');
        rv.classList.remove('hidden');
        rv.innerHTML = `<div style="font-size:3rem; font-weight:bold; color:var(--primary)">${score}/30</div>
            <h2>${score >= 29 ? '🎉 恭喜通过！' : '❌ 未及格'}</h2>
            <button class="btn" style="margin-top:20px" onclick="showDashboard()">返回首页</button>`;
    }

    function switchMode(m) {
        if (m === 'list') showDashboard();
        else startMode('mistake');
    }
</script>
</body>
</html>
