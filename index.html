<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>希腊驾照模拟 - GitHub版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #00529b; --success: #27ae60; --error: #e74c3c; --bg: #f0f2f5; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .nav { background: var(--primary); color: white; padding: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); position: sticky; top:0; z-index:99; }
        .container { max-width: 700px; margin: 10px auto; padding: 0 10px; padding-bottom: 120px; }
        .import-box { background: white; padding: 30px; border-radius: 15px; text-align: center; border: 3px dashed #cbd5e0; margin-top: 20px; }
        .hidden { display: none !important; }
        .controls { background: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; margin-bottom: 10px; }
        .prefix-config { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; color: #666; background: #fffde7; padding: 5px 10px; border-radius: 5px; }
        .q-card { background: white; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); padding: 20px; margin-bottom: 15px; }
        .img-container { text-align: center; margin-bottom: 15px; }
        .img-container img { max-width: 100%; max-height: 280px; border-radius: 8px; border: 1px solid #eee; }
        .q-text { border-left: 5px solid var(--primary); padding-left: 12px; margin-bottom: 20px; }
        .en { font-size: 1.1rem; font-weight: bold; color: #2d3748; display: block; margin-bottom: 4px; }
        .cn { font-size: 1.05rem; color: #16a085; display: block; }
        .opt { border: 2px solid #edf2f7; border-radius: 10px; padding: 15px; margin-bottom: 10px; cursor: pointer; background: #fff; transition: 0.1s; display: flex; }
        .opt.correct { background: #e6fffa !important; border-color: var(--success) !important; color: #22543d; font-weight: bold; }
        .opt.wrong { background: #fff5f5 !important; border-color: var(--error) !important; color: #822727; }
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -3px 15px rgba(0,0,0,0.05); }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="nav">
    <h2 style="margin:0">希腊驾照模拟 (GitHub 云端版)</h2>
</div>

<div class="container">
    <div class="import-box" id="importBox">
        <h3>第一步：加载数据文件</h3>
        <p>请选择你的 <b>data.csv</b> 文件</p>
        <input type="file" id="csvFile" accept=".csv" onchange="handleFiles(this)">
    </div>

    <div id="practiceArea" class="hidden">
        <div class="controls">
            <select id="catSelect" onchange="onCatChange()"></select>
            <div class="prefix-config">
                <span>图片前缀修正：</span>
                <input type="text" id="prefixInput" style="width:80px" placeholder="如：保养" oninput="render()">
                <span>(如果图不出，请在此输入图片名开头的汉字)</span>
            </div>
        </div>
        <div id="quiz"></div>
    </div>
</div>

<div class="footer hidden" id="footer">
    <button class="btn" onclick="move(-1)">上题</button>
    <div id="pageInfo" style="text-align:center; font-size:0.8rem">0/0</div>
    <button class="btn" onclick="move(1)">下题</button>
</div>

<script>
    let masterData = []; 
    let filteredData = [];
    let currentIdx = 0;
    let locked = false;

    // 自动加载本地存储
    window.onload = function() {
        const saved = localStorage.getItem('greece_drive_github_v1');
        if (saved) {
            masterData = JSON.parse(saved);
            finishImport();
        }
    }

    function handleFiles(input) {
        Papa.parse(input.files[0], {
            header: false,
            skipEmptyLines: true,
            complete: function(res) {
                processRows(res.data);
                saveToLocal();
                finishImport();
            }
        });
    }

    function processRows(data) {
        masterData = [];
        for (let col = 0; col < data[0].length; col += 3) {
            let catEn = data[0][col];
            let catCn = data[0][col+1] || "";
            if (!catEn) continue;

            for (let row = 1; row < data.length; row++) {
                let cellEn = data[row][col], cellCn = data[row][col+1];
                if (cellEn && cellEn.trim().length > 10) {
                    const q = parseLogic(cellEn, cellCn);
                    if (q) {
                        q.cat = catCn.trim();
                        // 提取中文专题名的前两个字作为默认图片前缀
                        q.defaultPrefix = catCn.match(/^[\u4e00-\u9fa5]{2}/) ? catCn.match(/^[\u4e00-\u9fa5]{2}/)[0] : "";
                        q.rowIdx = row - 1; // 对应图片编号
                        masterData.push(q);
                    }
                }
            }
        }
    }

    function parseLogic(en, cn) {
        let ansIdx = -1;
        const text = cn.replace(/\s/g, "");
        if (text.includes("√1)")) ansIdx = 0;
        else if (text.includes("√2)")) ansIdx = 1;
        else if (text.includes("√3)")) ansIdx = 2;

        const splitT = (t) => {
            let p = t.split(/\d\)\s?/);
            return { q: p[0].replace(/√/g, "").trim(), opts: p.slice(1).map(o => o.replace(/√/g, "").trim()).filter(o => o !== "") };
        };
        const enC = splitT(en), cnC = splitT(cn);
        if (enC.opts.length < 2) return null;
        return { qEn: enC.q, qCn: cnC.q, options: enC.opts.map((e, i) => ({ en: e, cn: cnC.opts[i] || "" })), ans: ansIdx };
    }

    function finishImport() {
        document.getElementById('importBox').classList.add('hidden');
        document.getElementById('practiceArea').classList.remove('hidden');
        document.getElementById('footer').classList.remove('hidden');
        const cats = [...new Set(masterData.map(d => d.cat))];
        document.getElementById('catSelect').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join("");
        filterData();
    }

    function filterData() {
        const c = document.getElementById('catSelect').value;
        filteredData = masterData.filter(d => d.cat === c);
        // 自动填入当前专题的前缀
        document.getElementById('prefixInput').value = filteredData[0].defaultPrefix;
        currentIdx = 0;
        render();
    }

    function render() {
        const q = filteredData[currentIdx];
        locked = false;
        document.getElementById('pageInfo').innerText = `${currentIdx + 1} / ${filteredData.length}`;

        const customPrefix = document.getElementById('prefixInput').value;
        // 核心：寻找 images/前缀+编号.jpg
        let imgPath = `images/${customPrefix}${q.rowIdx}.jpg`;

        document.getElementById('quiz').innerHTML = `
            <div class="q-card">
                <div class="img-container">
                    <img src="${imgPath}" onerror="this.src='https://placehold.co/400x200?text=Wait...Try+ID+${q.rowIdx}'">
                    <div style="font-size:0.6rem; color:#ccc; margin-top:5px">预期文件名: ${customPrefix}${q.rowIdx}.jpg</div>
                </div>
                <div class="q-text"><span class="en">${q.qEn}</span><span class="cn">${q.qCn}</span></div>
                <div class="options">
                    ${q.options.map((o, i) => `
                        <div class="opt" onclick="check(${i}, this)">
                            <span style="font-weight:bold; margin-right:10px">${i+1})</span>
                            <div style="flex:1"><div>${o.en}</div><div style="color:#666; font-size:0.9rem">${o.cn}</div></div>
                        </div>
                    `).join("")}
                </div>
            </div>
        `;
    }

    function check(idx, el) {
        if (locked) return; locked = true;
        const q = filteredData[currentIdx];
        const opts = document.querySelectorAll('.opt');
        if (idx === q.ans) el.classList.add('correct');
        else { el.classList.add('wrong'); if(q.ans !== -1) opts[q.ans].classList.add('correct'); }
    }

    function move(step) {
        currentIdx = (currentIdx + step + filteredData.length) % filteredData.length;
        render();
        window.scrollTo(0,0);
    }

    function saveToLocal() { localStorage.setItem('greece_drive_github_v1', JSON.stringify(masterData)); }
    function onCatChange() { filterData(); }
</script>
</body>
</html>
