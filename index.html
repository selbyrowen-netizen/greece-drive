<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>希腊驾照模拟 - V29 手册版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #00529b; --success: #27ae60; --error: #e74c3c; --bg: #f4f7f9; --tip-accent: #fab005; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 0; user-select: none; }
        
        /* 导航与标题 */
        .nav { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .nav h2 { margin: 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .home-btn { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }

        .container { max-width: 1100px; margin: 10px auto; padding: 0 10px; padding-bottom: 120px; }
        
        /* 模式切换 */
        .mode-tabs { display: flex; background: white; border-radius: 12px; margin-bottom: 15px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: bold; font-size: 0.9rem; color: #666; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: #f0f7ff; }

        .cat-list { background: white; border-radius: 15px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .cat-item { display: flex; flex-direction: column; padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .progress-bar { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: var(--success); transition: width 0.3s; }

        /* 题目卡片：左右分栏 */
        .q-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 25px; margin-bottom: 15px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; min-height: 450px; }
        .q-text-section { grid-column: 1; }
        .q-img-section { grid-column: 2; display: flex; align-items: center; justify-content: center; background: #fafafa; border-radius: 15px; border: 1px solid #eee; padding: 10px; height: 350px; position: sticky; top: 70px; }
        .q-img-section img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .q-header { border-left: 6px solid var(--primary); padding-left: 15px; margin-bottom: 25px; }
        .en { font-size: 1.1rem; font-weight: bold; color: #2d3748; display: block; margin-bottom: 6px; line-height: 1.4; }
        .cn { font-size: 1.05rem; color: #16a085; display: block; line-height: 1.4; }

        .opt { border: 2px solid #edf2f7; border-radius: 12px; padding: 15px; margin-bottom: 12px; cursor: pointer; background: #fff; display: flex; align-items: flex-start; transition: 0.1s; }
        .opt.correct { background: #e6fffa !important; border-color: var(--success) !important; color: #22543d; font-weight: bold; }
        .opt.wrong { background: #fff5f5 !important; border-color: var(--error) !important; color: #822727; }

        /* 💡 悬浮秘籍按钮 */
        .tip-toggle { 
            position: fixed; bottom: 85px; right: 20px; 
            background: var(--tip-accent); color: #fff; 
            width: 56px; height: 56px; border-radius: 28px; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 12px rgba(251,192,45,0.4); 
            cursor: pointer; z-index: 99; transition: 0.3s; 
            font-size: 1.5rem;
        }
        .tip-toggle:hover { transform: scale(1.1); }

        /* 秘籍面板 */
        .tip-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 1000; 
            display: none; align-items: center; justify-content: center; 
            backdrop-filter: blur(5px);
        }
        .tip-panel { 
            background: white; width: 90%; max-width: 500px; max-height: 80vh; 
            border-radius: 20px; padding: 25px; overflow-y: auto; position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .tip-panel h3 { margin-top: 0; color: var(--tip-border); display: flex; align-items: center; gap: 10px; }
        .tip-item { background: #fff9db; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid var(--tip-border); font-size: 0.95rem; color: #856404; line-height: 1.6; }
        .close-tip { position: absolute; top: 15px; right: 15px; font-size: 1.5rem; cursor: pointer; color: #ccc; }

        /* 底部操作 */
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -3px 15px rgba(0,0,0,0.05); z-index:100; }
        .btn { padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; background: var(--primary); color: white; }
        .btn-grey { background: #edf2f7; color: #4a5568; }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .q-card { grid-template-columns: 1fr; display: flex; flex-direction: column; padding: 15px; gap: 15px; min-height: auto; }
            .q-img-section { order: -1; height: 250px; position: static; }
            .q-img-section.no-img { display: none !important; }
        }
    </style>
</head>
<body>

<div class="nav">
    <button id="backBtn" class="home-btn hidden" onclick="location.reload()">🏠 首页</button>
    <h2 id="navTitle">希腊驾照模拟</h2>
    <select id="fileSelect" onchange="loadFile()" style="background:rgba(255,255,255,0.2); color:white; border:none; border-radius:4px; padding:4px;">
        <option value="data.csv">汽车考题</option>
        <option value="datamoto.csv">摩托考题</option>
    </select>
</div>

<!-- 💡 悬浮按钮 -->
<div id="tipBtn" class="tip-toggle hidden" onclick="toggleTips(true)">💡</div>

<!-- 秘籍面板遮罩 -->
<div id="tipOverlay" class="tip-overlay" onclick="toggleTips(false)">
    <div class="tip-panel" onclick="event.stopPropagation()">
        <span class="close-tip" onclick="toggleTips(false)">&times;</span>
        <h3>💡 本章解题秘籍</h3>
        <div id="tipContent"></div>
    </div>
</div>

<div class="container">
    <div id="statusBox" style="text-align:center; padding:40px; background:white; border-radius:15px; margin-top:20px;">
        <h3>正在构建知识手册...</h3>
    </div>

    <div id="mainTabs" class="mode-tabs hidden">
        <div id="tab-list" class="tab active" onclick="switchTab('list')">专题列表</div>
        <div id="tab-mistake" class="tab" onclick="switchTab('mistake')">错题本</div>
        <div class="tab" onclick="startExam()">模拟考试</div>
    </div>

    <div id="practiceArea" class="hidden">
        <div style="background:#fffde7; padding:8px; font-size:0.75rem; border-radius:10px; margin-bottom:10px; text-align:center; border: 1px solid #fbc02d">
            图片修正: <input type="text" id="manualPrefix" style="width:70px; border:1px solid #ccc;" oninput="updateUI()">
            + 题号: <b id="curImgNum" style="color:red"></b>
        </div>
        <div id="quizContent"></div>
    </div>

    <div id="listView" class="cat-list hidden"></div>
    <div id="resultView" class="hidden" style="text-align:center; padding:40px; background:white; border-radius:15px;"></div>
</div>

<div id="quizFooter" class="footer hidden">
    <button class="btn btn-grey" onclick="moveQ(-1)">上题</button>
    <div id="pageInfo" style="font-weight:bold; font-size:0.9rem"></div>
    <button class="btn" onclick="moveQ(1)">下题</button>
</div>

<script>
    const HISTORY_KEY = 'g_hist_v29';
    const MISTAKE_KEY = 'g_mist_v29';

    let masterData = [], currentQuestions = [], currentIdx = 0, currentMode = 'list';
    let topicTips = {}; // 存储每个专题的全部总结
    let userHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    let mistakeIds = JSON.parse(localStorage.getItem(MISTAKE_KEY) || '[]');

    window.onload = loadFile;

    function loadFile() {
        const file = document.getElementById('fileSelect').value;
        Papa.parse(file, {
            download: true, skipEmptyLines: true,
            complete: (res) => { parseCSV(res.data); showDashboard(); }
        });
    }

    function parseCSV(data) {
        masterData = [];
        topicTips = {};
        for (let col = 0; col < data[0].length; col += 3) {
            let catEn = data[0][col];
            let catCn = data[0][col+1] || "";
            if (!catEn) continue;
            let catName = catCn.trim() || catEn.trim();
            let imgPrefix = catName.split("专题")[0].trim();
            
            topicTips[catName] = [];

            for (let row = 1; row < data.length; row++) {
                let cellEn = data[row][col], cellCn = data[row][col+1];
                if (!cellEn || cellEn.trim().length < 5) continue;

                if (cellEn.includes("1)")) {
                    const q = splitLogic(cellEn, cellCn);
                    if (q) {
                        q.cat = catName;
                        q.prefix = imgPrefix;
                        q.rowNum = row;
                        q.uid = catName + "_" + row;
                        masterData.push(q);
                    }
                } else {
                    // 非题目行，全部抓进该专题的秘籍池
                    topicTips[catName].push({ en: cellEn.trim(), cn: cellCn ? cellCn.trim() : "" });
                }
            }
        }
    }

    function splitLogic(en, cn) {
        let ans = -1; const t = cn.replace(/\s/g, "");
        if (t.includes("√1)")) ans = 0; else if (t.includes("√2)")) ans = 1; else if (t.includes("√3)")) ans = 2;
        const s = (txt) => {
            let p = txt.split(/\d\)\s?/);
            return { q: p[0].replace(/√/g, "").trim(), o: p.slice(1).map(x => x.replace(/√/g, "").trim()).filter(x => x !== "") };
        };
        const eC = s(en), cC = s(cn);
        if (eC.o.length < 2) return null;
        return { qEn: eC.q, qCn: cC.q, options: eC.o.map((e, i) => ({ en: e, cn: cC.o[i] || "" })), ans };
    }

    function showDashboard() {
        currentMode = 'list';
        document.getElementById('statusBox').classList.add('hidden');
        document.getElementById('mainTabs').classList.remove('hidden');
        document.getElementById('listView').classList.remove('hidden');
        document.getElementById('practiceArea').classList.add('hidden');
        document.getElementById('quizFooter').classList.add('hidden');
        document.getElementById('backBtn').classList.add('hidden');
        document.getElementById('tipBtn').classList.add('hidden');
        
        const cats = [...new Set(masterData.map(d => d.cat))];
        let html = "";
        cats.forEach(c => {
            const list = masterData.filter(d => d.cat === c);
            const done = list.filter(d => userHistory[d.uid]).length;
            const perc = Math.round((done / list.length) * 100);
            html += `<div class="cat-item" onclick="startPractice('${c}')">
                <div style="display:flex; justify-content:space-between"><b>${c}</b><span>${done}/${list.length}</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:${perc}%"></div></div>
            </div>`;
        });
        document.getElementById('listView').innerHTML = html;
    }

    function startPractice(cat) {
        currentMode = 'practice';
        currentQuestions = masterData.filter(d => d.cat === cat);
        currentIdx = 0;
        enterQuiz();
    }

    function enterQuiz() {
        document.getElementById('listView').classList.add('hidden');
        document.getElementById('mainTabs').classList.add('hidden');
        document.getElementById('practiceArea').classList.remove('hidden');
        document.getElementById('quizFooter').classList.remove('hidden');
        document.getElementById('backBtn').classList.remove('hidden');
        
        // 只有非模拟考模式显示秘籍按钮
        if (currentMode !== 'exam') {
            document.getElementById('tipBtn').classList.remove('hidden');
            renderTipContent();
        }
        
        updateUI();
    }

    function renderTipContent() {
        const cat = currentQuestions[0].cat;
        const tips = topicTips[cat] || [];
        const content = document.getElementById('tipContent');
        if (tips.length === 0) {
            content.innerHTML = "<p style='color:#999'>本章暂无逻辑总结。</p>";
        } else {
            content.innerHTML = tips.map(t => `
                <div class="tip-item">
                    <b>• ${t.cn}</b>
                    <div style="font-size:0.8rem; opacity:0.8; margin-top:5px">${t.en}</div>
                </div>
            `).join("");
        }
    }

    function toggleTips(show) {
        document.getElementById('tipOverlay').style.display = show ? 'flex' : 'none';
    }

    function updateUI() {
        const q = currentQuestions[currentIdx];
        if(!q) return;
        const isAnswered = q.userAns !== undefined;
        document.getElementById('pageInfo').innerText = `${currentIdx + 1} / ${currentQuestions.length}`;
        document.getElementById('curImgNum').innerText = q.rowNum;

        const pf = document.getElementById('manualPrefix').value || q.prefix;
        const fileName = encodeURI(pf + q.rowNum + ".jpg");

        document.getElementById('quizContent').innerHTML = `
            <div class="q-card">
                <div class="q-text-section">
                    <div class="q-header"><span class="en">${q.qEn}</span><span class="cn">${q.qCn}</span></div>
                    <div class="options">
                        ${q.options.map((o, i) => {
                            let cls = isAnswered ? (i === q.ans ? "correct" : (i === q.userAns ? "wrong" : "")) : "";
                            return `<div class="opt ${cls}" onclick="handleCheck(${i})">
                                <span style="font-weight:bold;margin-right:10px">${i+1})</span>
                                <div style="flex:1"><div>${o.en}</div><div style="color:#666;font-size:0.85rem">${o.cn}</div></div>
                            </div>`;
                        }).join("")}
                    </div>
                </div>
                <div class="q-img-section" id="imgBox">
                    <img id="qImg" src="${fileName}" 
                         onload="this.parentElement.style.visibility='visible'" 
                         onerror="trySubV29(this, '${fileName}')">
                </div>
            </div>`;
    }

    function trySubV29(img, encoded) {
        if (!img.dataset.tried) {
            img.dataset.tried = "true";
            img.src = "images/" + encoded;
        } else {
            img.style.display = 'none';
            // 电脑端保留灰色框，手机端隐藏
            if(window.innerWidth <= 768) img.parentElement.style.display = 'none';
        }
    }

    function handleCheck(idx) {
        const q = currentQuestions[currentIdx];
        if (q.userAns !== undefined) return;
        q.userAns = idx;
        if (idx === q.ans) {
            userHistory[q.uid] = true;
            localStorage.setItem(HISTORY_KEY, JSON.stringify(userHistory));
        } else {
            if (!mistakeIds.includes(q.uid)) {
                mistakeIds.push(q.uid);
                localStorage.setItem(MISTAKE_KEY, JSON.stringify(mistakeIds));
            }
        }
        updateUI();
    }

    function moveQ(s) {
        if (currentMode === 'exam' && currentIdx === currentQuestions.length - 1 && s > 0) return finishExam();
        currentIdx = (currentIdx + s + currentQuestions.length) % currentQuestions.length;
        updateUI();
        window.scrollTo(0,0);
    }

    function startMistakes() {
        currentMode = 'mistake';
        currentQuestions = masterData.filter(d => mistakeIds.includes(d.uid));
        if(currentQuestions.length === 0) return alert("没找到错题！");
        currentIdx = 0;
        enterQuiz();
    }

    function startExam() {
        currentMode = 'exam';
        currentQuestions = [...masterData].sort(() => 0.5 - Math.random()).slice(0, 30);
        currentQuestions.forEach(q => delete q.userAns);
        currentIdx = 0;
        enterQuiz();
    }

    function finishExam() {
        const score = currentQuestions.filter(q => q.userAns === q.ans).length;
        document.getElementById('practiceArea').classList.add('hidden');
        document.getElementById('quizFooter').classList.add('hidden');
        document.getElementById('tipBtn').classList.add('hidden');
        const rv = document.getElementById('resultView');
        rv.classList.remove('hidden');
        rv.innerHTML = `<div style="font-size:3rem; font-weight:bold; color:var(--primary)">${score}/30</div>
            <h2>${score >= 29 ? '🎉 恭喜通过！' : '❌ 未及格'}</h2>
            <button class="btn" style="margin-top:20px" onclick="location.reload()">返回首页</button>`;
    }

    function switchTab(t) {
        if (t === 'list') location.reload();
        else startMistakes();
    }
</script>
</body>
</html>
